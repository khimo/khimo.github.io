<!DOCTYPE html>
<html lang="en">
{% include head.html %}
<body class="has-menu" id="page-top" data-spy="scroll" data-target="#toc" data-offset="90">
  <div id="scrollProgress"></div>
  {% include nav.html %}

  <div class="doc-shell">

    <aside class="rail" aria-label="Page navigation">
      <nav id="toc"></nav>
    </aside>

    <header class="page-head" role="banner">
      <div class="ph-meta">
        <span class="ph-type-label">Reference</span>
      </div>
      <h1 class="ph-title">{{ page.title }}</h1>
      {% if page.tagline %}<p class="ph-lead">{{ page.tagline }}</p>{% endif %}
      <div class="ph-rule"></div>
    </header>

    <main id="pagecontent" class="pagecontent" data-pagefind-body>
      {{ content }}
    </main>

  </div><!-- /.doc-shell -->

  {% include foot.html %}
  {% include scripts.html %}
  </body>
</html>
