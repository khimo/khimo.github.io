# Site settings
title:
email:
description: > # this means to ignore newlines until "baseurl:"
baseurl: "" # the subpath of your site, e.g. /blog/
url: "https://khimo.github.io" # the base hostname & protocol for your site
highlighter: rouge

twitter_username:
github_username:

# Build settings
markdown: kramdown

kramdown:
  auto_ids: true # Auto-generate ID's for headings


# Jekyll collections
collections:
  help_drivers:
    output: true
    permalink: /help_drivers/:path/
  bli_advanced_user_guide:
    output: true
    permalink: /bli-guides/bli_advanced_user_guide/:path
  01-setup-bli-pro:
    output: true
    permalink: /bli-guides/bli-pro-user-guide/01-setup-bli-pro/:path
  bli-pro-user-guide:
    output: true
    permalink: /bli-guides/bli-pro-user-guide/:path
  ideas:
    output: true
    permalink: /bli-guides/ideas/:path
  manuals:
    output: true
    permalink: /bli-guides/manuals/:path
  developers-guides:
    output: true
    permalink: /bli-guides/developers-guides/:path
  lua-macro-snippets:
    output: true
    permalink: /bli-guides/manuals/howto-lua-macros/:path
    directory: /bli-guides/_lua-macro-snippets/

  
collections_dir: bli-guides

#jekyll plugins for TOC and sitemap
plugins:
  - jekyll-toc
  - jekyll-sitemap

# Preserve the static search indexes across Jekyll rebuilds. Both are generated
# AFTER the Jekyll build: Pagefind into _site/pagefind/, and the semantic
# embedding index into _site/search-index.json (used by /search2.html).
keep_files:
  - pagefind
  - search-index.json

# Internal-only dirs/files kept OUT of the published site
exclude:
  - tasks/                 # file-based task tracker (also contains literal {% raw %}{% include %}{% endraw %} text that breaks the build)
  - redesign-proposal/     # standalone landing prototype + design-system docs
  - docker-compose.yml
  - Gemfile
  - Gemfile.lock
  - README.md
  - Makefile
  - create_email_anser.sh
  - vendor/bundle/
  - .sass-cache/
  - .jekyll-cache/
  - node_modules/          # transformers package for the embeddings build step
