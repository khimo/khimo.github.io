<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="{{ page.description | default: 'BeoLiving Intelligence documentation' }}">
    <meta name="author" content="support@khimo.com">
    <meta name="keywords" content="{{ page.keywords | default: 'BLI' }}, BeoLiving Intelligence, Khimo, B&O, Home Automation, Bang&Olufsen, Smart Home">

    <title>{{ page.title }}</title>

    <link rel="icon" href="/favicon.ico">

    <!-- Bootstrap (kept for the grid / utilities used inside documentation content) -->
    <link href="/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome (icons used inside documentation content) -->
    <link href="/vendor/font-awesome/css/font-awesome.min.css" rel="stylesheet" type="text/css">
    <!-- bootstrap-toc CSS (auto sidebar TOC, restyled by khimo-content.css) -->
    <link rel="stylesheet" href="https://cdn.rawgit.com/afeld/bootstrap-toc/v1.0.0/dist/bootstrap-toc.min.css">
    <!-- Pygments syntax tokens -->
    <link rel="stylesheet" href="/css/syntax.css" type="text/css">

    <!-- khimo design system — fonts + tokens/themes + web (menu) + content language.
         Loaded AFTER Bootstrap so the khimo language wins on type, colour and chrome. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/khimo.css">
    <link rel="stylesheet" href="/css/khimo-web.css">
    <link rel="stylesheet" href="/css/khimo-content.css">

    {% include pagefind-meta.html %}

    <!-- THEME BOOT (pre-paint, no flash) -->
    <script>try{var t=localStorage.getItem('khimo-theme');
    if(!t&&window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)t='light';
    if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>

</head>
